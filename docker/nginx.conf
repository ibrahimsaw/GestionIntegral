server {
    listen 80;
    server_name _;
    client_max_body_size 50m;

    location /static/ {
        alias /usr/share/nginx/html/static/;
        access_log off;
        expires 7d;
    }

    location ^~ /_protected_media/ {
        internal;
        alias /usr/share/nginx/html/media/;
        add_header X-Content-Type-Options nosniff always;
    }

    location ^~ /media/avatars/ {
        proxy_pass http://web:8000/protected-media/avatars/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location ^~ /media/documents/ {
        proxy_pass http://web:8000/protected-media/documents/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location ^~ /media/piges/ {
        proxy_pass http://web:8000/protected-media/piges/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location ^~ /media/proofs/ {
        proxy_pass http://web:8000/protected-media/proofs/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location ^~ /media/visuels/ {
        proxy_pass http://web:8000/protected-media/visuels/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /media/ {
        alias /usr/share/nginx/html/media/;
        expires 1h;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
