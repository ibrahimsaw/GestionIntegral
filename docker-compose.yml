services:
  web:
    build: .
    container_name: gestion_integral_app
    restart: always
    expose:
      - "8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - django_media:/app/media
      - django_static:/app/staticfiles
    environment:
      DEBUG: "False"
      DATABASE_PATH: ${DATABASE_PATH:-/app/data/db.sqlite3}
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && exec gunicorn geoad.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"

  gateway:
    image: nginx:alpine
    restart: always
    depends_on:
      - web
    ports:
      - "8087:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - django_media:/usr/share/nginx/html/media:ro
      - django_static:/usr/share/nginx/html/static:ro

volumes:
  django_media:
  django_static: