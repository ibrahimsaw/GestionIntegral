services:
  web:
    build: .
    container_name: gestion_integral_app
    restart: always
    ports:
      - "8087:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - django_media:/app/media
    environment:
      DEBUG: "False"
      DATABASE_PATH: ${DATABASE_PATH:-/app/data/db.sqlite3}
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && exec gunicorn geoad.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"

volumes:
  django_media: