<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs>
    <!-- Le pattern fait 120x120px et se répète parfaitement -->
    <pattern id="voronoi-seamless" width="120" height="120" patternUnits="userSpaceOnUse">
      <!-- Couleur du fond des cellules -->
      <rect width="120" height="120" fill="#f8d848"/>

      <!-- Contour des cellules (Jointures) -->
      <path d="
        M 30,0 L 45,25 L 25,55 L 0,60
        M 120,60 L 95,55 L 75,20 L 90,0
        M 30,120 L 45,95 L 25,65 L 0,60
        M 120,60 L 95,65 L 75,100 L 90,120
        M 45,25 L 75,20
        M 45,95 L 75,100
        M 25,55 L 45,95
        M 95,55 L 75,100
        M 45,25 L 55,45 L 75,40 L 95,55
        M 55,45 L 45,70 L 65,80 L 75,60 L 75,40
        M 25,55 L 45,70
        M 65,80 L 45,95
      " stroke="#ebbe24" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </pattern>
  </defs>

  <!-- Remplissage de l'écran avec le pattern -->
  <rect width="100%" height="100%" fill="url(#voronoi-seamless)"/>
</svg>
