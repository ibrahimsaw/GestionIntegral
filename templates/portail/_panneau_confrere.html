{% for panneau_confrere in panneaux_confreres %}
<dl class="row mb-2">
  <dt class="col-sm-5">Nom du confrère</dt><dd class="col-sm-7">{{ panneau_confrere.nom }}</dd>
  <dt class="col-sm-5">Ville / localité</dt><dd class="col-sm-7">{{ panneau_confrere.ville }}</dd>
  <dt class="col-sm-5">Emplacement du panneau</dt><dd class="col-sm-7">{{ panneau_confrere.emplacement }}</dd>
  <dt class="col-sm-5">Format</dt><dd class="col-sm-7">{{ panneau_confrere.format }}</dd>
  <dt class="col-sm-5">Nombre de faces</dt><dd class="col-sm-7">{{ panneau_confrere.nombre_faces }}</dd>
</dl>
{% endfor %}
