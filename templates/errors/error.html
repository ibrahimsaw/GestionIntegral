<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{{ error_code }} — {{ error_title }} | Integral</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root { color-scheme:light; }
    body {
      min-height:100vh; display:grid; place-items:center; margin:0; padding:24px;
      color:#1f2937; background:radial-gradient(circle at top left,#f8e9e8,transparent 42%),#f4f6f9;
      font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
    }
    .error-card {
      width:min(100%,560px); padding:clamp(28px,6vw,52px); text-align:center;
      background:#fff; border:1px solid #e5e7eb; border-radius:20px;
      box-shadow:0 20px 60px rgba(31,41,55,.09);
    }
    .error-brand { color:#932e2b; font-size:.8rem; font-weight:800; letter-spacing:.16em; text-transform:uppercase; }
    .error-icon {
      display:grid; place-items:center; width:76px; height:76px; margin:25px auto 16px;
      color:#932e2b; background:#f8e9e8; border-radius:50%; font-size:2rem;
    }
    .error-code { color:#932e2b; font-size:clamp(3.2rem,12vw,5.5rem); font-weight:800; line-height:1; }
    .error-title { margin:12px 0 8px; font-size:1.45rem; font-weight:750; }
    .error-message { max-width:410px; margin:0 auto; color:#64748b; line-height:1.65; }
    .error-actions { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin-top:26px; }
    .btn-integral { color:#fff; background:#932e2b; border-color:#932e2b; }
    .btn-integral:hover { color:#fff; background:#7f2725; border-color:#7f2725; }
  </style>
</head>
<body>
  <main class="error-card">
    <div class="error-brand">Integral · Gestion publicitaire</div>
    <div class="error-icon" aria-hidden="true"><i class="bi bi-exclamation-triangle"></i></div>
    <div class="error-code">{{ error_code }}</div>
    <h1 class="error-title">{{ error_title }}</h1>
    <p class="error-message">{{ error_message }}</p>
    <div class="error-actions">
      <a href="/gestion/" class="btn btn-integral">
        <i class="bi bi-house-door me-1"></i>Retour à l’accueil
      </a>
      <a href="/gestion/accounts/login/" class="btn btn-outline-secondary">
        <i class="bi bi-box-arrow-in-right me-1"></i>Connexion
      </a>
    </div>
  </main>
</body>
</html>
