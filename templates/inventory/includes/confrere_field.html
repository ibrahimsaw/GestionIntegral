<div{% if wide %} class="rc-wide"{% endif %}>
  <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}{% if field.field.required %} <span aria-hidden="true">*</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<div id="{{ field.auto_id }}_helptext" class="form-text">{{ field.help_text }}</div>{% endif %}
  {% if field.errors %}<div class="rc-form-errors">{{ field.errors }}</div>{% endif %}
</div>
