<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 800 600">
  <defs>
    <!-- Définition du motif répétable (Seamless Pattern) -->
    <pattern id="voronoi-pattern" width="200" height="200" patternUnits="userSpaceOnUse">
      <!-- Fond jaune principal -->
      <rect width="200" height="200" fill="#facc2e" />
      
      <!-- Lignes et cellules (Jointures légèrement plus foncées) -->
      <path d="
        M0,0 L200,0 L200,200 L0,200 Z
        M20,10 L50,5 L80,25 L65,55 L30,60 L10,35 Z
        M80,25 L120,10 L150,30 L140,65 L100,70 L65,55 Z
        M150,30 L185,15 L200,45 L180,80 L140,65 Z
        M30,60 L65,55 L80,95 L50,120 L15,100 Z
        M65,55 L100,70 L115,110 L80,125 L80,95 Z
        M100,70 L140,65 L160,105 L125,120 L115,110 Z
        M140,65 L180,80 L195,120 L160,105 Z
        M15,100 L50,120 L40,160 L10,150 Z
        M50,120 L80,125 L75,170 L40,160 Z
        M80,125 L125,120 L120,165 L75,170 Z
        M125,120 L160,105 L175,150 L145,175 L120,165 Z
        M160,105 L195,120 L200,160 L175,150 Z
      " 
      stroke="#f5bd1b" 
      stroke-width="5" 
      stroke-linejoin="round" 
      stroke-linecap="round" 
      fill="#f7d038" />
    </pattern>
  </defs>

  <!-- Application du pattern sur tout le SVG -->
  <rect width="100%" height="100%" fill="url(#voronoi-pattern)" />
</svg>
